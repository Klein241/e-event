<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#F3C64F"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fond Circulaire Élégant -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="8 8" stroke-opacity="0.4"/>

  <!-- Rayonnement Doré -->
  <circle cx="256" cy="256" r="140" fill="url(#gold)" opacity="0.08" filter="url(#glow)"/>

  <!-- Symbole Central : Couronne Célébration + Flamme de Prière + Étoiles -->
  <!-- Couronne / Arche Royale -->
  <path d="M140 330 L160 210 L215 260 L256 160 L297 260 L352 210 L372 330 Z" 
        fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="160" cy="195" r="12" fill="url(#gold)"/>
  <circle cx="256" cy="145" r="15" fill="#FFF3B0"/>
  <circle cx="352" cy="195" r="12" fill="url(#gold)"/>

  <!-- Flamme / Esprit / Cœur au centre -->
  <path d="M256 240 C240 280 230 310 256 340 C282 310 272 280 256 240 Z" fill="#FFF3B0"/>

  <!-- Étoiles de brillance -->
  <path d="M120 150 L125 135 L140 130 L125 125 L120 110 L115 125 L100 130 L115 135 Z" fill="url(#gold)"/>
  <path d="M390 140 L394 128 L406 124 L394 120 L390 108 L386 120 L374 124 L386 128 Z" fill="url(#gold)"/>
  <path d="M256 380 L260 370 L270 367 L260 364 L256 354 L252 364 L242 367 L252 370 Z" fill="#F3C64F"/>

  <!-- Anneau de communion / Réseau -->
  <circle cx="200" cy="380" r="18" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="312" cy="380" r="18" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <path d="M218 380 L294 380" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
</svg>
